<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D6B62}a:hover{color:#0A524B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F5; color: #15181C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; padding: 24px 4px 8px">
    <a href="Home-Recents.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #15181C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Settings</h1>
  </header>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 0">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #545B63; text-transform: uppercase; letter-spacing: 0.06em">{{g.title}}</h2>
        <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <a href="{{r.href}}" style="min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 8px 16px; color: #15181C; text-decoration: none; border-top: {{r.divider}}">
              <span style="width: 24px; height: 24px; color: #0D6B62; display: flex">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
              </span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{r.label}}</span>
                <sc-if value="{{r.hasSub}}" hint-placeholder-val="{{true}}">
                  <span style="font-size: 13px; color: #545B63">{{r.sub}}</span>
                </sc-if>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 0 20px 32px; text-align: center; font-size: 13px; color: #6B7280">Folio: Doc Maker · Version 1.0.0</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (rows) => rows.map((r, i) => Object.assign({ divider: i ? '1px solid #EEF0F2' : '0', href: r.href || 'Settings.dc.html', hasSub: !!r.sub }, r));
    return {
      groups: [
        { title: 'Defaults', rows: mk([
          { label: 'Page size', sub: 'A4', icon: 'M6 3h8l4 4v14H6zM14 3v4h4' },
          { label: 'Quality', sub: 'Balanced', icon: 'M4 7h10M18 7h2M4 17h4M12 17h8' }
        ]) },
        { title: 'Privacy', rows: mk([
          { label: 'How Folio protects your privacy', sub: 'Works offline, nothing uploaded', icon: 'M5 11h14v9H5zM8 11V8a4 4 0 0 1 8 0v3', href: 'Privacy.dc.html' }
        ]) },
        { title: 'About', rows: mk([
          { label: 'Send feedback', sub: 'Opens your email app', icon: 'M3 6h18v12H3zM3 7l9 6 9-6' },
          { label: 'Rate Folio', sub: 'Opens Google Play', icon: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z' },
          { label: 'Open-source licences', sub: '', icon: 'M8 6l-6 6 6 6M16 6l6 6-6 6' }
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
