<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D6B62}a:hover{color:#0A524B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F5; color: #15181C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 24px 4px 8px">
    <a href="Home-Recents.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #15181C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <button type="button" aria-label="Rename document" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; display: flex; align-items: center; gap: 6px; padding: 0 4px; font: 600 17px 'Plus Jakarta Sans', sans-serif; color: #15181C; text-align: left">
      <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Folio_20261006_1430</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545B63" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
    </button>
    <button type="button" aria-label="More options" style="width: 48px; height: 48px; border: 0; background: transparent; color: #15181C; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
    </button>
  </header>

  <div style="padding: 0 20px 12px; font-size: 13px; color: #545B63">5 pages · Hold and drag a page to reorder</div>

  <div style="flex: 1; overflow: hidden; padding: 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; align-content: start">
    <sc-for list="{{pages}}" as="p" hint-placeholder-count="5">
      <div style="position: relative; display: flex; flex-direction: column; gap: 6px">
        <a href="PageDetail-Crop.dc.html" aria-label="Page {{p.n}}, open to edit" style="position: relative; display: block; height: 176px; background: #FFFFFF; border: 1px solid #E3E5E8; border-radius: 12px; box-sizing: border-box; padding: 20px 18px; text-decoration: none; box-shadow: 0 1px 3px rgba(21,24,28,0.06)">
          <span style="display: flex; flex-direction: column; gap: 7px; filter: {{p.filter}}">
            <span style="height: 8px; width: {{p.w}}; background: #8E9196; border-radius: 3px"></span>
            <span style="height: 5px; background: #D5D8DC; border-radius: 3px"></span>
            <span style="height: 5px; background: #D5D8DC; border-radius: 3px"></span>
            <span style="height: 5px; width: 78%; background: #D5D8DC; border-radius: 3px"></span>
            <span style="height: 22px; border-radius: 4px; background: {{p.block}}"></span>
            <span style="height: 5px; background: #D5D8DC; border-radius: 3px"></span>
            <span style="height: 5px; width: 60%; background: #D5D8DC; border-radius: 3px"></span>
          </span>
          <span style="position: absolute; left: 8px; bottom: 8px; min-width: 26px; height: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 13px; background: #15181C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
        </a>
        <button type="button" aria-label="Page {{p.n}} options" style="position: absolute; right: 2px; top: 2px; width: 40px; height: 40px; border: 0; background: rgba(255,255,255,0.9); border-radius: 20px; color: #15181C; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
        </button>
      </div>
    </sc-for>
    <button type="button" style="height: 176px; border: 1.5px dashed #9AA1A9; border-radius: 12px; background: transparent; color: #0A524B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font: 600 15px 'Plus Jakarta Sans', sans-serif">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      Add pages
    </button>
  </div>

  <div style="padding: 14px 20px 32px; background: #F6F7F5; border-top: 1px solid #E3E5E8">
    <a href="Export-Sheet.dc.html" style="height: 56px; border-radius: 16px; background: #0D6B62; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>
      Create PDF
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pages: [
        { n: 1, w: '62%', block: '#E2F0EE', filter: 'none' },
        { n: 2, w: '48%', block: '#EDEEF0', filter: 'none' },
        { n: 3, w: '70%', block: '#D5D8DC', filter: 'grayscale(1)' },
        { n: 4, w: '55%', block: '#FBEFD9', filter: 'none' },
        { n: 5, w: '40%', block: '#EDEEF0', filter: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
