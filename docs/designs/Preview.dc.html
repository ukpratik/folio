<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D6B62}a:hover{color:#0A524B}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #E8EAEC; color: #15181C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 24px 4px 8px; background: #F6F7F5; border-bottom: 1px solid #E3E5E8">
    <a href="Result-Success.dc.html" aria-label="Close preview" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #15181C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Folio_20261006_1430.pdf</span>
      <span style="font-size: 12px; color: #545B63">6 pages · 438 KB</span>
    </div>
    <button type="button" aria-label="Share" style="width: 48px; height: 48px; border: 0; background: transparent; color: #0D6B62; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4"></path><path d="M8.2 13.2l7.6 4.4"></path></svg>
    </button>
  </header>

  <div aria-label="PDF pages, pinch to zoom" style="flex: 1; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0">
    <sc-for list="{{pages}}" as="p" hint-placeholder-count="2">
      <div style="width: 330px; height: 467px; flex-shrink: 0; background: #FFFFFF; box-shadow: 0 2px 8px rgba(21,24,28,0.12); box-sizing: border-box; padding: 40px 34px; display: flex; flex-direction: column; gap: 12px">
        <div style="height: 12px; width: 52%; background: #3A3D42; border-radius: 3px"></div>
        <div style="height: 6px; background: #9EA3A9; border-radius: 3px"></div>
        <div style="height: 6px; background: #9EA3A9; border-radius: 3px"></div>
        <div style="height: 6px; width: 84%; background: #9EA3A9; border-radius: 3px"></div>
        <div style="height: 60px; background: {{p.block}}; border-radius: 4px"></div>
        <div style="height: 6px; background: #9EA3A9; border-radius: 3px"></div>
        <div style="height: 6px; width: 70%; background: #9EA3A9; border-radius: 3px"></div>
        <div style="height: 6px; background: #9EA3A9; border-radius: 3px"></div>
        <div style="height: 6px; width: 60%; background: #9EA3A9; border-radius: 3px"></div>
      </div>
    </sc-for>
  </div>

  <div role="status" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 8px 14px; border-radius: 18px; background: rgba(21,24,28,0.85); color: #FFFFFF; font-size: 13px; font-weight: 600">Page 1 of 6</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { pages: [{ block: '#E2F0EE' }, { block: '#EDEEF0' }] };
  }
}
</script>
</body>
</html>
