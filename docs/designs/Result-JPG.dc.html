<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Images ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D6B62}a:hover{color:#0A524B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F5; color: #15181C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; padding: 24px 4px 0">
    <a href="Home-Recents.dc.html" aria-label="Back to home" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #15181C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; font-size: 17px; font-weight: 600">Images ready</div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 19px; font-weight: 700">Marksheet_Class12</div>
      <div style="font-size: 15px; color: #545B63">3 images · 96–141 KB each</div>
      <div style="align-self: flex-start; margin-top: 4px; padding: 7px 12px; border-radius: 10px; background: #E2F0EE; color: #0A524B; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Each under 200 KB
      </div>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{files}}" as="f" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 14px; padding: 10px 14px 10px 10px">
          <div style="width: 44px; height: 58px; flex-shrink: 0; border: 1px solid #E3E5E8; border-radius: 6px; box-sizing: border-box; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px">
            <div style="height: 4px; width: 60%; background: #8E9196; border-radius: 2px"></div>
            <div style="height: 3px; background: #D5D8DC; border-radius: 2px"></div>
            <div style="height: 3px; background: #D5D8DC; border-radius: 2px"></div>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>
            <span style="font-size: 13px; color: #545B63">{{f.size}}</span>
          </div>
        </li>
      </sc-for>
    </ul>
  </main>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 32px">
    <button type="button" style="height: 58px; border: 0; border-radius: 16px; background: #0D6B62; color: #FFFFFF; font: 600 16px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4"></path><path d="M8.2 13.2l7.6 4.4"></path></svg>
      Share 3 images
    </button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 56px; border: 1.5px solid #C9CDD2; border-radius: 14px; background: #FFFFFF; color: #15181C; font: 600 14px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v10H3z"></path></svg>
        Save to folder
      </button>
      <a href="Editor.dc.html" style="height: 56px; border: 1.5px solid #C9CDD2; border-radius: 14px; box-sizing: border-box; background: #FFFFFF; color: #15181C; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v13a2 2 0 0 0 2 2h13"></path><path d="M3 6h13a2 2 0 0 1 2 2v13"></path></svg>
        Edit
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      files: [
        { name: 'Marksheet_Class12_01.jpg', size: '141 KB' },
        { name: 'Marksheet_Class12_02.jpg', size: '118 KB' },
        { name: 'Marksheet_Class12_03.jpg', size: '96 KB' }
      ]
    };
  }
}
</script>
</body>
</html>
