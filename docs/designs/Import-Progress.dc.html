<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adding photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D6B62}a:hover{color:#0A524B}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F5; color: #15181C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 24px 4px 8px">
    <a href="Home-Recents.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #15181C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; font-size: 17px; font-weight: 600">Folio_20261006_1502</div>
  </header>

  <div role="status" style="margin: 0 20px 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #545B63"><span>Adding 12 photos…</span><span>4 of 12</span></div>
    <div role="progressbar" aria-label="Adding photos" aria-valuemin="0" aria-valuemax="12" aria-valuenow="4" style="height: 6px; border-radius: 3px; background: #E3E5E8; overflow: hidden">
      <div style="width: 33%; height: 100%; background: #0D6B62; border-radius: 3px"></div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; align-content: start">
    <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
      <sc-if value="{{p.ready}}" hint-placeholder-val="{{true}}">
        <div style="position: relative; height: 176px; background: #FFFFFF; border: 1px solid #E3E5E8; border-radius: 12px; box-sizing: border-box; padding: 20px 18px; display: flex; flex-direction: column; gap: 7px">
          <span style="height: 8px; width: 58%; background: #8E9196; border-radius: 3px"></span>
          <span style="height: 5px; background: #D5D8DC; border-radius: 3px"></span>
          <span style="height: 5px; background: #D5D8DC; border-radius: 3px"></span>
          <span style="height: 5px; width: 78%; background: #D5D8DC; border-radius: 3px"></span>
          <span style="position: absolute; left: 8px; bottom: 8px; min-width: 26px; height: 26px; border-radius: 13px; background: #15181C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
        </div>
      </sc-if>
      <sc-if value="{{p.loading}}" hint-placeholder-val="{{false}}">
        <div aria-label="Page {{p.n}} loading" style="position: relative; height: 176px; background: #ECEEEF; border-radius: 12px; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9AA1A9" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
          <span style="position: absolute; left: 8px; bottom: 8px; min-width: 26px; height: 26px; border-radius: 13px; background: #C9CDD2; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 118px; background: #22262B; color: #FFFFFF; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.4; box-shadow: 0 6px 20px rgba(21,24,28,0.2)">2 images couldn't be added (unsupported or damaged).</div>

  <div style="padding: 14px 20px 32px; border-top: 1px solid #E3E5E8">
    <button type="button" disabled style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: #DDE0E3; color: #6B7280; font: 600 16px 'Plus Jakarta Sans', sans-serif">Create PDF</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pages = [1, 2, 3, 4, 5, 6].map((n) => ({ n, ready: n <= 4, loading: n > 4 }));
    return { pages };
  }
}
</script>
</body>
</html>
