<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheets and dialogs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D6B62}a:hover{color:#0A524B}
</style>
</helmet>
<div style="width: 1680px; height: 844px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 40px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15181C; background: #FFFFFF">

  <section aria-label="Add pages chooser" style="position: relative; height: 844px; background: #F6F7F5; overflow: hidden">
    <div style="padding: 28px 20px; font-size: 13px; font-weight: 700; color: #545B63; letter-spacing: 0.06em; text-transform: uppercase">Add pages · FR-06</div>
    <div style="position: absolute; inset: 0; background: rgba(14,16,18,0.48)"></div>
    <div role="dialog" aria-label="Add pages" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 12px 28px; display: flex; flex-direction: column">
      <div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #C9CDD2; margin-bottom: 12px"></div>
      <div style="padding: 0 12px 8px; font-size: 17px; font-weight: 700">Add pages</div>
      <button type="button" style="height: 60px; border: 0; background: transparent; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-radius: 12px; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #15181C; text-align: left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0D6B62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Scan with camera
      </button>
      <button type="button" style="height: 60px; border: 0; background: transparent; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-radius: 12px; font: 600 15px 'Plus Jakarta Sans', sans-serif; color: #15181C; text-align: left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0D6B62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.5"></circle><path d="M21 16l-5-5-9 9"></path></svg>Import images
      </button>
    </div>
  </section>

  <section aria-label="Rename dialog" style="position: relative; height: 844px; background: #F6F7F5; overflow: hidden">
    <div style="padding: 28px 20px; font-size: 13px; font-weight: 700; color: #545B63; letter-spacing: 0.06em; text-transform: uppercase">Rename · FR-23</div>
    <div style="position: absolute; inset: 0; background: rgba(14,16,18,0.48)"></div>
    <div role="dialog" aria-labelledby="rnTitle" style="position: absolute; left: 24px; right: 24px; top: 250px; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <h2 id="rnTitle" style="margin: 0; font-size: 20px; font-weight: 700">Rename</h2>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #545B63">File name</span>
        <span style="display: flex; align-items: center; height: 52px; border: 2px solid #0D6B62; border-radius: 12px; padding: 0 14px; box-sizing: border-box">
          <input type="text" value="Marksheet_Class12" style="flex: 1; min-width: 0; border: 0; outline: none; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #15181C; background: transparent">
          <span style="font-size: 14px; color: #6B7280">.pdf</span>
        </span>
        <span style="display: flex; justify-content: space-between; font-size: 12px; color: #545B63"><span>Symbols like / : * ? become _</span><span>17 / 100</span></span>
      </label>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button type="button" style="height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: transparent; color: #0A524B; font: 600 15px 'Plus Jakarta Sans', sans-serif">Cancel</button>
        <button type="button" style="height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #0D6B62; color: #FFFFFF; font: 600 15px 'Plus Jakarta Sans', sans-serif">Rename</button>
      </div>
    </div>
  </section>

  <section aria-label="Recent document menu" style="position: relative; height: 844px; background: #F6F7F5; overflow: hidden">
    <div style="padding: 28px 20px 16px; font-size: 13px; font-weight: 700; color: #545B63; letter-spacing: 0.06em; text-transform: uppercase">Recent row menu · FR-25</div>
    <div style="margin: 0 12px; display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 16px; padding: 10px 10px">
      <div style="width: 48px; height: 64px; border: 1px solid #E3E5E8; border-radius: 6px"></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 600">Rent_Receipt_Sept</span><span style="font-size: 13px; color: #545B63">1 page · 182 KB</span></div>
    </div>
    <div role="menu" aria-label="Rent_Receipt_Sept options" style="position: absolute; right: 20px; top: 150px; width: 220px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 8px 28px rgba(21,24,28,0.18); padding: 6px 0; display: flex; flex-direction: column">
      <button type="button" role="menuitem" style="height: 48px; border: 0; background: transparent; text-align: left; padding: 0 16px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #15181C">Share</button>
      <button type="button" role="menuitem" style="height: 48px; border: 0; background: transparent; text-align: left; padding: 0 16px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #15181C">Save to device</button>
      <button type="button" role="menuitem" style="height: 48px; border: 0; background: transparent; text-align: left; padding: 0 16px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #15181C">Rename</button>
      <a href="Delete-Dialog.dc.html" role="menuitem" style="height: 48px; display: flex; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 500; color: #B42318; text-decoration: none">Delete</a>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 32px; background: #22262B; color: #FFFFFF; border-radius: 12px; padding: 14px 16px; font-size: 14px">Saved</div>
  </section>

  <section aria-label="Keep scanned pages dialog" style="position: relative; height: 844px; background: #3B3430; overflow: hidden">
    <div style="padding: 28px 20px; font-size: 13px; font-weight: 700; color: #E3E5E8; letter-spacing: 0.06em; text-transform: uppercase">Close camera · FR-02</div>
    <div style="position: absolute; inset: 0; background: rgba(14,16,18,0.55)"></div>
    <div role="alertdialog" aria-labelledby="kpTitle" style="position: absolute; left: 24px; right: 24px; top: 280px; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
      <h2 id="kpTitle" style="margin: 0; font-size: 20px; font-weight: 700">Keep 3 scanned pages?</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #545B63">They'll be saved as a draft you can finish later.</p>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px">
        <button type="button" style="height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: transparent; color: #B42318; font: 600 15px 'Plus Jakarta Sans', sans-serif">Discard</button>
        <a href="Editor.dc.html" style="height: 48px; padding: 0 20px; border-radius: 12px; background: #0D6B62; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 600">Keep</a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
