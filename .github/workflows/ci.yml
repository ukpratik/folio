# SPDX-License-Identifier: GPL-3.0-or-later
# CI gates from ADR-0017: build, tests, lint, privacy (permissions).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintPlayDebug lintFdroidDebug

      - name: Build release APKs (unsigned)
        run: ./gradlew assemblePlayRelease assembleFdroidRelease

      - name: Privacy gate — permissions allowlist (ADR-0013)
        run: scripts/check-permissions.sh app/build/outputs/apk/*/release/*.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/"
