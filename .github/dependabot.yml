version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    ignore:
      # Pinned at 4.9.0: 4.10+ crash (SIGILL) on some ARM64 devices (ADR-0009 note). Upgrade by hand after testing.
      - dependency-name: "org.opencv:opencv"
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
